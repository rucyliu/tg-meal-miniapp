<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>每日點餐助手</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="app-container">
    <!-- 頂部狀態列 -->
    <header class="app-header">
      <div class="header-left">
        <span class="app-title"><i class="fa-solid fa-utensils"></i> 每日點餐助手</span>
        <span id="today-date" class="date-badge">載入中...</span>
      </div>
      <div class="header-right">
        <span id="order-status-badge" class="status-badge status-pending">
          <i class="fa-regular fa-clock"></i> 尚未點餐
        </span>
        <button id="btn-refresh" class="icon-btn" title="重新整理資料">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </header>

    <!-- 三大核心分頁 -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tab-order">
        <i class="fa-solid fa-bowl-food"></i> 今日點餐
      </button>
      <button class="tab-btn" data-tab="tab-history">
        <i class="fa-solid fa-receipt"></i> 點餐紀錄
      </button>
      <button class="tab-btn" data-tab="tab-reviews">
        <i class="fa-solid fa-star-half-stroke"></i> 歷史評價
      </button>
    </nav>

    <!-- 分頁 1：今日點餐與智慧湊單 -->
    <main id="tab-order" class="tab-content active">
      <!-- 預算智慧湊單卡片 -->
      <section class="card combo-card">
        <div class="combo-row">
          <div class="combo-title">
            <i class="fa-solid fa-wand-magic-sparkles"></i> 預算湊單
          </div>
          <div class="input-group">
            <label for="budget-input">上限 $</label>
            <input type="number" id="budget-input" value="150" min="30" max="1000" step="5" />
          </div>
          <div class="combo-actions">
            <button id="btn-recommend" class="btn btn-primary">
              <i class="fa-solid fa-bolt"></i> 推薦組合
            </button>
            <button type="button" id="btn-clear-recommend" class="icon-btn" title="隱藏推薦組合" disabled>
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
        <div id="combo-results" class="combo-results hidden"></div>
      </section>

      <!-- 菜單管理按鈕列 -->
      <div class="toolbar-row">
        <span class="section-hint"><i class="fa-solid fa-circle-info"></i> 點擊店家列可展開或收合品項</span>
        <div class="toolbar-actions">
          <button id="btn-open-store-library" class="btn btn-outline-sm">
            <i class="fa-solid fa-book-open"></i> 菜單庫 <span id="library-count-badge"></span>
          </button>
          <button id="btn-add-custom-item" class="btn btn-outline-sm">
            <i class="fa-solid fa-plus"></i> 手動新增
          </button>
        </div>
      </div>

      <!-- 今日菜單關鍵字搜尋 -->
      <div class="search-box menu-search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="menu-search-input" placeholder="搜尋今日餐點、飲料或店名..." />
        <button type="button" id="btn-clear-menu-search" class="icon-btn-plain hidden" title="清除搜尋">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 菜單價格篩選、排序與一鍵收合列 -->
      <section id="menu-filter-bar" class="card menu-filter-bar">
        <div class="menu-filter-group">
          <label for="menu-max-price"><i class="fa-solid fa-filter"></i> 價格</label>
          <div class="price-input-wrap">
            <input type="number" id="menu-max-price" min="1" max="2000" step="5" placeholder="上限 $" />
            <button type="button" id="btn-clear-price-filter" class="icon-btn-plain hidden" title="清除價格篩選">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
        <div class="menu-filter-group">
          <select id="menu-sort-select" title="品項排序方式">
            <option value="default">預設順序</option>
            <option value="price_asc">價格：低 → 高</option>
            <option value="price_desc">價格：高 → 低</option>
            <option value="rating_desc">評價：高 → 低</option>
            <option value="count_desc">點過：多 → 少</option>
          </select>
        </div>
        <button type="button" id="btn-toggle-all-stores" class="btn btn-ghost btn-sm" title="全部展開或收合">
          <i class="fa-solid fa-angles-down"></i> 全部展開
        </button>
      </section>

      <section id="menu-container" class="menu-container">
        <div class="empty-state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p>正在同步今日菜單...</p>
        </div>
      </section>
    </main>

    <!-- 分頁 2：點餐紀錄（本週餐費請領統計 ＋ 批次匯入 ＋ 逐品項評價） -->
    <main id="tab-history" class="tab-content">
      <section id="weekly-allowance-card" class="card allowance-card"></section>

      <div class="search-box" style="margin-bottom:8px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="history-search-input" placeholder="搜尋歷史訂餐（店名、品項、口味或日期）..." />
        <button type="button" id="btn-clear-history-search" class="icon-btn-plain hidden" title="清除搜尋">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="toolbar-row">
        <span id="history-count-hint" class="section-hint">點餐紀錄</span>
        <button id="btn-open-import-history" class="btn btn-outline-sm">
          <i class="fa-solid fa-file-import"></i> 批次匯入紀錄
        </button>
      </div>

      <div id="history-container" class="history-container">
        <div class="empty-state"><p>尚無點餐紀錄</p></div>
      </div>
    </main>

    <!-- 分頁 3：歷史評價查詢 -->
    <main id="tab-reviews" class="tab-content">
      <section class="card filter-card">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="review-search-input" placeholder="搜尋店名、餐點名稱、標籤或心得..." />
          <button id="btn-clear-search" class="icon-btn-plain hidden" title="清除搜尋">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="filter-chips" id="review-rating-filters">
          <button class="filter-chip active" data-filter="all">全部</button>
          <button class="filter-chip" data-filter="good"><i class="fa-solid fa-star"></i> 高分 (4-5★)</button>
          <button class="filter-chip" data-filter="mid">普通 (3★)</button>
          <button class="filter-chip" data-filter="bad"><i class="fa-solid fa-triangle-exclamation"></i> 雷區 (1-2★)</button>
        </div>
      </section>

      <div id="reviews-container" class="reviews-container">
        <div class="empty-state"><p>尚無歷史評價</p></div>
      </div>
    </main>

    <!-- 底部固定購物車與固定格式輸出列 -->
    <footer id="cart-bar" class="cart-bar hidden">
      <div class="cart-summary" id="cart-toggle-bar">
        <div class="cart-info">
          <button type="button" id="btn-toggle-cart" class="icon-btn-sm" title="展開/收合明細">
            <i class="fa-solid fa-chevron-down" id="cart-chevron"></i>
          </button>
          <span class="cart-count"><i class="fa-solid fa-bag-shopping"></i> 已選 <strong id="cart-item-count">0</strong> 項</span>
          <span class="cart-total">共 $<strong id="cart-total-price">0</strong></span>
          <button type="button" id="btn-apply-remaining-budget" class="btn-budget-filter" title="將剩餘預算帶入菜單價格上限篩選">
            <i class="fa-solid fa-filter"></i> 剩$150 篩選
          </button>
        </div>
        <div class="cart-summary-actions">
          <button type="button" id="btn-clear-cart" class="text-danger-btn">清空</button>
        </div>
      </div>

      <div id="cart-body" class="cart-body">
        <div id="cart-items-list" class="cart-items-list"></div>

        <div class="preview-box">
          <div class="preview-header">
            <span>輸出格式預覽（可直接微調）：</span>
            <label class="preview-toggle-label">
              <input type="checkbox" id="toggle-append-thanks" checked />
              <span>句尾加謝謝</span>
            </label>
          </div>
          <textarea id="format-preview" class="preview-textarea" rows="3"></textarea>
        </div>

        <button id="btn-confirm-copy" class="btn btn-success btn-block">
          <i class="fa-solid fa-copy"></i> 確認點餐並複製格式
        </button>
      </div>
    </footer>
  </div>

  <!-- 回到頂部懸浮按鈕 -->
  <button id="btn-back-to-top" class="back-to-top hidden" title="回到頂部">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- 彈窗 1：針對單一餐點撰寫評價 -->
  <div id="rating-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-star"></i> 撰寫餐點評價</h3>
        <button class="icon-btn" data-close-modal="rating-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div id="modal-review-target" class="modal-target-box"></div>
        <div class="star-selector" id="star-selector">
          <i class="fa-solid fa-star active" data-val="1"></i>
          <i class="fa-solid fa-star active" data-val="2"></i>
          <i class="fa-solid fa-star active" data-val="3"></i>
          <i class="fa-solid fa-star active" data-val="4"></i>
          <i class="fa-solid fa-star active" data-val="5"></i>
        </div>
        <div class="quick-tags" id="quick-tags">
          <span class="tag-chip" data-tag="#會回購">#會回購</span>
          <span class="tag-chip" data-tag="#CP值高">#CP值高</span>
          <span class="tag-chip" data-tag="#份量足">#份量足</span>
          <span class="tag-chip" data-tag="#好喝">#好喝</span>
          <span class="tag-chip" data-tag="#偏油">#偏油</span>
          <span class="tag-chip" data-tag="#太甜">#太甜</span>
          <span class="tag-chip" data-tag="#偏鹹">#偏鹹</span>
          <span class="tag-chip" data-tag="#份量少">#份量少</span>
          <span class="tag-chip" data-tag="#踩雷">#踩雷</span>
        </div>
        <textarea id="review-comment" rows="3" placeholder="寫下針對這份餐點的心得（選填）..."></textarea>
        <button id="btn-submit-review" class="btn btn-primary btn-block">
          <i class="fa-solid fa-check"></i> 送出評價
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 2：編輯／新增菜單品項與金額 -->
  <div id="menu-edit-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="menu-modal-title"><i class="fa-solid fa-pen-to-square"></i> 編輯品項</h3>
        <button class="icon-btn" data-close-modal="menu-edit-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-menu-id" />
        <div class="form-group">
          <label for="edit-store-select">選擇菜單庫店家（或自行輸入新店家）</label>
          <select id="edit-store-select" style="margin-bottom:6px;"></select>
          <input type="text" id="edit-store-name" placeholder="輸入店家名稱，例如：禾饗" />
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label for="edit-category">分類</label>
            <select id="edit-category">
              <option value="主餐">主餐</option>
              <option value="飲料">飲料</option>
              <option value="單點/配菜">單點/配菜</option>
              <option value="加料">加料</option>
              <option value="店家備註">店家備註</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-price">金額 / 加價 ($)</label>
            <input type="number" id="edit-price" min="0" step="1" value="0" />
          </div>
        </div>
        <div class="form-group">
          <label for="edit-item-name">品項名稱 / 備註內容</label>
          <input type="text" id="edit-item-name" placeholder="例如：火雞肉飯便當 或 主餐加大 +$10" />
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label for="edit-spec">規格（選填）</label>
            <input type="text" id="edit-spec" placeholder="例如：L、M、大碗" />
          </div>
          <div class="form-group">
            <label for="edit-note">原始備註（選填）</label>
            <input type="text" id="edit-note" placeholder="例如：甜度固定" />
          </div>
        </div>
        <div class="modal-footer-btns">
          <button id="btn-delete-menu-item" class="btn btn-danger hidden">
            <i class="fa-solid fa-trash"></i> 刪除
          </button>
          <button id="btn-save-menu-item" class="btn btn-primary" style="flex:1;">
            <i class="fa-solid fa-floppy-disk"></i> 儲存
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈窗 3：修改店家名稱 -->
  <div id="store-rename-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-store"></i> 修改店家名稱</h3>
        <button class="icon-btn" data-close-modal="store-rename-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rename-old-store" />
        <div class="form-group">
          <label for="rename-new-store">新的店家名稱（將同步更新該店品項、歷史紀錄與評價）</label>
          <input type="text" id="rename-new-store" />
        </div>
        <button id="btn-save-store-rename" class="btn btn-primary btn-block">
          <i class="fa-solid fa-check"></i> 確認修改
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 4：選擇加料要掛載在哪一杯飲料底下 -->
  <div id="topping-target-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-mug-saucer"></i> 選擇加料目標飲料</h3>
        <button class="icon-btn" data-close-modal="topping-target-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div id="topping-modal-info" class="modal-target-box"></div>
        <div id="topping-target-list" class="topping-target-list"></div>
        <button id="btn-add-topping-standalone" class="btn btn-ghost btn-block" style="margin-top:10px;">
          <i class="fa-solid fa-plus"></i> 不掛載，改以獨立品項加入
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 5：菜單庫（依名稱排序 ＋ 切換今日店家 / 複選批次刪除） -->
  <div id="store-library-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-book-open"></i> 菜單庫管理</h3>
        <button class="icon-btn" data-close-modal="store-library-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="lib-mode-switch">
          <button type="button" id="btn-lib-mode-active" class="lib-mode-btn active">
            <i class="fa-solid fa-calendar-check"></i> 切換今日店家
          </button>
          <button type="button" id="btn-lib-mode-delete" class="lib-mode-btn">
            <i class="fa-solid fa-trash-can"></i> 批次刪除
          </button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="store-lib-search" placeholder="依名稱搜尋（已按名稱排序，方便找重複）..." />
        </div>

        <div class="store-lib-summary">
          <span id="store-lib-selected-hint">已勾選 0 家</span>
          <div class="store-lib-quick-actions">
            <button type="button" id="btn-store-lib-select-all" class="text-accent-btn hidden">全選</button>
            <button type="button" id="btn-uncheck-all-stores" class="text-danger-btn">全部取消</button>
          </div>
        </div>

        <div id="store-library-list" class="store-lib-list"></div>

        <button id="btn-apply-store-library" class="btn btn-primary btn-block" style="margin-top:12px;">
          <i class="fa-solid fa-check"></i> 套用為今日菜單
        </button>
        <button id="btn-batch-delete-stores" class="btn btn-danger btn-block hidden" style="margin-top:12px;" disabled>
          <i class="fa-solid fa-trash-can"></i> 永久刪除已選 (0 家)
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 6：批次匯入歷史點餐紀錄 -->
  <div id="import-history-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-file-import"></i> 批次匯入歷史點餐紀錄</h3>
        <button class="icon-btn" data-close-modal="import-history-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="import-raw-text">貼上點餐文字（不同筆紀錄請以「空行」分隔；可於首行加日期如 2026-11-20）</label>
          <textarea id="import-raw-text" rows="7" placeholder="範例：&#10;滿大方 - 酥炸排骨便當 $95&#10;新井茶 - 巧克力奶茶(無糖/熱飲) $55&#10;共 $150 謝謝&#10;&#10;雞客嚕嚕 - 鹽烤鯖魚 便當 $140 謝謝"></textarea>
        </div>
        <button type="button" id="btn-parse-import" class="btn btn-ghost btn-block" style="margin-bottom:10px;">
          <i class="fa-solid fa-magnifying-glass-chart"></i> 解析並預覽結果
        </button>
        <div id="import-preview-list" class="import-preview-list hidden"></div>
        <button type="button" id="btn-confirm-import" class="btn btn-primary btn-block hidden" style="margin-top:10px;">
          <i class="fa-solid fa-cloud-arrow-up"></i> 確認匯入紀錄
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 7：菜單原圖檢視燈箱（支援縮放與拖曳捲動） -->
  <div id="image-lightbox-modal" class="modal-backdrop hidden">
    <div class="lightbox-card">
      <div class="lightbox-header">
        <span id="lightbox-title" class="lightbox-title"><i class="fa-regular fa-image"></i> 菜單原圖</span>
        <div class="lightbox-controls">
          <button type="button" id="lightbox-zoom-out" class="icon-btn-sm" title="縮小">
            <i class="fa-solid fa-magnifying-glass-minus"></i>
          </button>
          <button type="button" id="lightbox-zoom-reset" class="btn btn-ghost btn-sm" title="還原 100%">100%</button>
          <button type="button" id="lightbox-zoom-in" class="icon-btn-sm" title="放大">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
          </button>
          <a id="lightbox-open-drive" href="#" target="_blank" rel="noopener" class="icon-btn-sm" title="另開原檔">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
          <button type="button" class="icon-btn-sm" data-close-modal="image-lightbox-modal" title="關閉">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div id="lightbox-viewport" class="lightbox-viewport">
        <div id="lightbox-loading" class="lightbox-loading">
          <i class="fa-solid fa-spinner fa-spin"></i> 正在載入菜單原圖...
        </div>
        <img id="lightbox-img" class="lightbox-img hidden" alt="菜單原圖" />
      </div>
      <div class="lightbox-hint">雙擊圖片可快速切換放大／還原，放大後可上下左右滑動檢視細節</div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="api.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
